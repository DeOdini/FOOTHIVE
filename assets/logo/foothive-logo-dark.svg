<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitleDark logoDescDark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logoTitleDark">FootHive (Dark Background Version)</title>
  <desc id="logoDescDark">FootHive brand logo — inverted for use on dark backgrounds</desc>

  <!-- Hexagon icon mark (cream fill for dark backgrounds) -->
  <polygon points="100,25 164.95,62.5 164.95,137.5 100,175 35.05,137.5 35.05,62.5"
           fill="#F5F0E6" stroke="#D2691E" stroke-width="4" />

  <!-- Monogram inside hexagon -->
  <text x="100" y="118" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="800"
        font-size="50" fill="#D2691E" letter-spacing="-1">FH</text>

  <!-- Small honeycomb accent dots -->
  <polygon points="590,20 600,25 600,35 590,40 580,35 580,25" fill="#D2691E" opacity="0.3"/>
  <polygon points="610,32 620,37 620,47 610,52 600,47 600,37" fill="#D2691E" opacity="0.2"/>

  <!-- Wordmark (cream + accent for dark backgrounds) -->
  <text x="220" y="100" font-family="Helvetica, Arial, sans-serif"
        font-weight="800" font-size="54" letter-spacing="1">
    <tspan fill="#F5F0E6">FOOT</tspan><tspan fill="#D2691E">HIVE</tspan>
  </text>

  <!-- Tagline -->
  <text x="223" y="132" font-family="Helvetica, Arial, sans-serif"
        font-weight="500" font-size="15" letter-spacing="5" fill="#B8B2A6">BUILT TO LAST</text>
</svg>
